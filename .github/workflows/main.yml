name: CI/CD for WCF Backend & WinForms Deployment

on:
  push:
    branches: [ main ]
#  pull_request:
#    branches: [ main ]

permissions:
  contents: write
  
jobs:
  deploy-front:
    runs-on: windows-latest

    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Clear PublishArtifacts/Front/MainMenu/ApplicationFiles/SIAPP_7_07_0002 folder
        run: |
          if (Test-Path "PublishArtifacts/Front/MainMenu/ApplicationFiles/SIAPP_7_07_0002") { Remove-Item "PublishArtifacts/Front/MainMenu/ApplicationFiles/SIAPP_7_07_0002" -Recurse -Force }
          New-Item -ItemType Directory -Path "PublishArtifacts/Front/MainMenu/ApplicationFiles/SIAPP_7_07_0002"

      - name: Copy files from src to dist (including subfolders)
        run: |
          $source = "${{ github.workspace }}\MainMenu\UpdateFiles"
          $dest = "${{ github.workspace }}\PublishArtifacts\Front\MainMenu\ApplicationFiles\SIAPP_7_07_0002"
          if (Test-Path $source) {
            Copy-Item "$source\*" $dest -Recurse -Force
          } else {
            Write-Host "Source folder not found: $source"
          }

      - name: Rename all files in PublishArtifacts/Front/MainMenu/ApplicationFiles/SIAPP_7_07_0002 recursively with .rdeploy extension
        run: |
          $dest = "${{ github.workspace }}\PublishArtifacts\Front\MainMenu\ApplicationFiles\SIAPP_7_07_0002"
          Get-ChildItem $dest -Recurse -File | ForEach-Object {
            Rename-Item $_.FullName ($_.FullName + ".rdeploy")
          }

      - name: List Published Files
        run: dir "${{ github.workspace }}\PublishArtifacts\Front\MainMenu\ApplicationFiles\SIAPP_7_07_0002" -Recurse

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployed-files
          path: ${{ github.workspace }}\PublishArtifacts\Front\MainMenu\ApplicationFiles\SIAPP_7_07_0002

      - name: Print Artifact Download Info
        run: |
          Write-Host "✅ Artifact 'deployed-files' uploaded."
          Write-Host "➡ Go to Actions → Workflow Run → Artifacts to download."

      - name: Print Artifact Download URL
        run: |
          $runId = "${{ github.run_id }}"
          $repo = "${{ github.repository }}"
          $url = "https://github.com/$repo/actions/runs/$runId"
          Write-Host "✅ Artifact uploaded successfully!"
          Write-Host "➡ Download it here: $url (scroll to Artifacts section)"

  deploy-to-iis:
    runs-on: self-hosted  # ✅ Must be a Windows server with IIS installed
    needs: deploy-front

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployed-files
          path: C:\temp\deployed-files

      - name: Deploy to IIS site folder
        run: |
          $source = "C:\temp\deployed-files"
          $dest = "C:\inetpub\wwwroot\mysite"
          if (Test-Path $dest) {
            Remove-Item "$dest\*" -Recurse -Force
          }
          Copy-Item "$source\*" $dest -Recurse -Force
          Write-Host "✅ Files deployed to IIS site folder: $dest"

