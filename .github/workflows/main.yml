name: CI/CD for WCF Backend & WinForms Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-wcf:
    runs-on: windows-latest

    steps:
    # 1. Checkout code
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Setup MSBuild and NuGet
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.0.5

    # 3. Restore NuGet packages
    - name: Restore NuGet Packages
      run: |
        nuget restore "${{ github.workspace }}\Back\AT\SIAPP_SERVICE_AT.sln"
        nuget restore "${{ github.workspace }}\Back\PN\SIAPP_SERVICE_PN SLN.sln"
        nuget restore "${{ github.workspace }}\Back\PY\SIAPP_SERVICE_PY SLN.sln"

    # Install Chocolatey (if not already available)
#    - name: Install Chocolatey
#      run: |
#        Set-ExecutionPolicy Bypass -Scope Process -Force
#        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
#        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

    # Install .NET Framework 4.0 Developer Pack
#    - name: Install .NET Framework 4.0 Developer Pack
#      run: |
#        choco install netfx-4.0-devpack -y

#    # Install Visual Studio Build Tools with MSBuild workload
#    - name: Install Visual Studio Build Tools
#      run: |
#        choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.MSBuildTools" -y

    # 4. Build all WCF projects
    - name: Build WCF Projects
      run: |
        msbuild Back/AT/SIAPP_SERVICE_AT.vbproj /p:Configuration=Release
        msbuild Back/PN/SIAPP_SERVICES_PN.vbproj /p:Configuration=Release
        msbuild Back/PY/SIAPP_SERVICE_PY.vbproj /p:Configuration=Release

    # 5. Publish WCF projects to staging folder
    - name: Create Publish Directory
      run: mkdir PublishArtifacts\WCF

    - name: Publish WCF Services
      run: |
        msbuild Back/AT/SIAPP_SERVICE_AT.vbproj /t:Publish /p:Configuration=Release /p:PublishDir=PublishArtifacts\WCF\SIAPP_SERVICE_AT
        msbuild Back/PN/SIAPP_SERVICES_PN.vbproj /t:Publish /p:Configuration=Release /p:PublishDir=PublishArtifacts\WCF\SIAPP_SERVICES_PN
        msbuild Back/PY/SIAPP_SERVICE_PY.vbproj /t:Publish /p:Configuration=Release /p:PublishDir=PublishArtifacts\WCF\SIAPP_SERVICES_PY

    # 6. Debug: List published files
    - name: List Published Files
      run: dir PublishArtifacts /s

    # 7. Upload WCF artifacts
    - name: Upload WCF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: wcf-services-publish
        path: PublishArtifacts\WCF

  deploy:
    runs-on: windows-latest
    needs: build-wcf

    steps:
    # 1. Download WCF artifacts
    - name: Download WCF Artifact
      uses: actions/download-artifact@v4
      with:
        name: wcf-services-publish

    # 2. Deploy WCF Services to IIS
    - name: Deploy WCF Services
      run: |
        "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" ^
        -verb:sync ^
        -source:contentPath=".\PublishArtifacts\WCF\SIAPP_SERVICE_AT" ^
        -dest:auto,computerName="https://${{ secrets.DEPLOY_SERVER }}:8172/msdeploy.axd",userName="${{ secrets.DEPLOY_USER }}",password="${{ secrets.DEPLOY_PASS }}",authType="Basic"

        "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" ^
        -verb:sync ^
        -source:contentPath=".\PublishArtifacts\WCF\SIAPP_SERVICES_PN" ^
        -dest:auto,computerName="https://${{ secrets.DEPLOY_SERVER }}:8172/msdeploy.axd",userName="${{ secrets.DEPLOY_USER }}",password="${{ secrets.DEPLOY_PASS }}",authType="Basic"

        "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" ^
        -verb:sync ^
        -source:contentPath=".\PublishArtifacts\WCF\SIAPP_SERVICES_PY" ^
        -dest:auto,computerName="https://${{ secrets.DEPLOY_SERVER }}:8172/msdeploy.axd",userName="${{ secrets.DEPLOY_USER }}",password="${{ secrets.DEPLOY_PASS }}",authType="Basic"

    # 3. Deploy WinForms ClickOnce files (from repo)
#    - name: Deploy WinForms App
#      run: |
#        Copy-Item ".\ClickOncePublish\*" "\\${{ secrets.DEPLOY_SERVER }}\DeploymentPath" -Recurse
